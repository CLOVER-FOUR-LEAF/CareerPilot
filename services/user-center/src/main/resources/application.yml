server:
  port: 8081

spring:
  application:
    name: user-center
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/careerpilot?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:careerpilot}
    password: ${MYSQL_PASSWORD:cp123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

jwt:
  # 生产环境必须用 JWT_SECRET 覆盖，默认值只够本地跑
  secret: ${JWT_SECRET:careerpilot-default-secret-key-must-be-at-least-256-bits-long-for-hs256}
  access-token-expiration: 7200
  refresh-token-expiration: 2592000

# 只暴露健康检查端点。
# actuator 的 env / beans / configprops / heapdump 等端点默认不开放，
# 这里显式写出来，是为了让「对外暴露面」在配置里可查，而不是依赖默认值。
management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: INFO
    com.careerpilot: DEBUG
