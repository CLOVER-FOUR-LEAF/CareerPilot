server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        # ── 用户与认证 ────────────────────────────────────────
        - id: user-center
          uri: http://${USER_CENTER_HOST:localhost:8081}
          predicates:
            - Path=/api/v1/auth/**,/api/v1/user/**

        # ── 简历 ────────────────────────────────────────────
        - id: resume-service
          uri: http://${RESUME_SERVICE_HOST:localhost:8082}
          predicates:
            - Path=/api/v1/resume/**

        # ── JD ──────────────────────────────────────────────
        - id: jd-service
          uri: http://${JD_SERVICE_HOST:localhost:8083}
          predicates:
            - Path=/api/v1/jd/**

        # ── 匹配 ────────────────────────────────────────────
        - id: match-service
          uri: http://${MATCH_SERVICE_HOST:localhost:8084}
          predicates:
            - Path=/api/v1/match/**

        # ── AI 任务与 AI 生成类功能 ──────────────────────────
        - id: ai-task-scheduler
          uri: http://${AI_SCHEDULER_HOST:localhost:8085}
          predicates:
            - Path=/api/v1/ai-tasks/**,/api/v1/optimize/**,/api/v1/interview/**,/api/v1/cover-letter/**,/api/v1/career-plan/**

      # 去掉上游可能重复的 CORS 头，统一由 CorsConfig 下发，
      # 否则响应里会出现两份 Access-Control-Allow-Origin，浏览器直接判定失败
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

      httpclient:
        # SSE 长连接：必须关掉响应超时，否则 /ai-tasks/{id}/stream 会被中途掐断
        connect-timeout: 5000
        response-timeout: 300s

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

jwt:
  # 生产必须用 JWT_SECRET 覆盖
  secret: ${JWT_SECRET:careerpilot-default-secret-key-must-be-at-least-256-bits-long-for-hs256}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.careerpilot: DEBUG
