server:
  port: 8082

spring:
  application:
    name: resume-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/careerpilot?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:careerpilot}
    password: ${MYSQL_PASSWORD:cp123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

careerpilot:
  ai-scheduler-url: ${AI_SCHEDULER_URL:http://localhost:8085}
  storage-root: ${STORAGE_ROOT:./data/uploads}
  max-file-size: 10485760

logging:
  level:
    root: INFO
    com.careerpilot: DEBUG
