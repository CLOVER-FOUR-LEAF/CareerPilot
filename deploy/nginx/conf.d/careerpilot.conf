upstream gateway {
    # 本地网关（Spring Cloud Gateway），不再是容器内的服务名
    server 127.0.0.1:8080;
}

server {
    listen 8088;
    server_name localhost;

    # 前端构建产物。用 scripts/local/build-frontend.ps1 构建后指向该目录。
    # Windows 下用正斜杠；Linux/macOS 下改成绝对路径即可。
    root ../../web/dist;
    index index.html;

    # ── 前端静态资源（SPA history 路由）────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可以长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── API 反向代理到网关 ────────────────────────────────────
    location /api/ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持：关缓冲 + 关缓存 + 断掉 Connection 头，
        # 否则 /ai-tasks/{id}/stream 的进度推送会被 nginx 攒成一坨最后一次性吐出
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 服务间回调接口本来就不走网关，这里再加一道，
    # 避免有人日后在网关里手滑加了路由把它暴露到公网
    location /internal/ {
        deny all;
        return 403;
    }

    # 网关的内部路径也一并挡掉
    location /actuator/ {
        deny all;
        return 403;
    }

    client_max_body_size 20M;
}
